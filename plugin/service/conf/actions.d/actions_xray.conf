[start]
# v3.0.0: %1 = inst_uuid (опционально; если не указан — запускает все инстансы)
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:start %s
type:script_output
# v4.0.5: не ронять ответ при exit(1) (напр. ошибка старта) — текст ошибки нужен GUI
errors:no
message:Starting Xray

[stop]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:stop %s
type:script_output
message:Stopping Xray

[restart]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:restart %s
type:script_output
errors:no
message:Restarting Xray

[reconfigure]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:reconfigure %s
type:script_output
errors:no
message:Reconfiguring Xray

[status]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:status %s
type:script_output
message:Xray status

[statusall]
# v3.0.0: статус всех инстансов в формате JSON {inst_uuid: {status, xray_core, tun2socks}}
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:statusall
type:script_output
message:Xray status all instances

[log]
command:/usr/bin/tail
parameters:-n 150 /tmp/xray_syshook.log
type:script_output
message:Xray log

[xraylog]
# Per-instance лог: UUID передаётся как %1, скрипт выбирает нужный файл.
command:/usr/local/opnsense/scripts/Xray/xray-log.php
parameters:%s
type:script_output
message:Xray core log

[testconnect]
# BUG-4 FIX: порт читается из config.xml через PHP-скрипт.
command:/usr/local/opnsense/scripts/Xray/xray-testconnect.php
parameters:%s
type:script_output
errors:no
message:Xray test connection

[validate]
# E5: сухой прогон конфига без применения.
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:validate %s
type:script_output
# v4.0.5: exit(1) при невалидном конфиге не должен глотать текст ошибки
errors:no
message:Validate Xray config

[validatefile]
# v4.0.0: валидация файла-черновика из редактора Raw JSON (кнопка Validate Config).
# %1 = путь к /tmp/xray-val-* (создаёт API-контроллер).
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:validatefile %s
type:script_output
# v4.0.5: exit(1) при невалидном черновике превращался в 'Execute error'
# в configd (check=True) — GUI получал 'No response from configd' вместо ошибки
errors:no
message:Validate Xray config draft

[generate]
# v4.0.0: печать сгенерированного config.json инстанса (Preview в GUI).
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:generate %s
type:script_output
errors:no
message:Generate Xray config

[ifstats]
# E4: статистика TUN-интерфейса для панели Diagnostics.
command:/usr/local/opnsense/scripts/Xray/xray-ifstats.php
parameters:%s
type:script_output
message:Xray TUN interface stats

[version]
command:/usr/local/opnsense/scripts/Xray/xray-service-control.php
parameters:version
type:script_output
message:Xray plugin version

[watchdog]
# E1: watchdog — запускается cron каждую минуту, итерирует все инстансы.
command:/usr/local/opnsense/scripts/Xray/xray-watchdog.php
parameters:
type:script_output
message:Xray watchdog check
